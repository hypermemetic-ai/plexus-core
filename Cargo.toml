[package]
name = "plexus-core"
version = "0.8.0"
edition = "2021"
description = "Core infrastructure for Plexus RPC: Activation trait, DynamicHub, schemas"
license = "AGPL-3.0-only"
repository = "https://github.com/hypermemetic-ai/plexus-core"
# DIST-2: the published crate is the library — not the design notes, editor
# settings or hooks that live beside it in the repository.
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]

[lib]
name = "plexus_core"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# PERF-7: an item's frame is split off a block as `Bytes`, written as it is.
bytes = "1.9"
# PERF-7: wrap_stream's stream, the method's own inside it unboxed.
pin-project-lite = "0.2"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# Bitflags for ChildCapabilities
bitflags = "2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Schema generation
schemars = { version = "1.1", features = ["derive", "uuid1"] }

# RETURNS-10: schema content hashes — SHA-256 of a method's canonical schema
# JSON, truncated to 16 hex (`plexus::content_hash`). RustCrypto, pure Rust.
sha2 = "0.10"

# HTTP types for RawRequestContext
http = "1"

# Core types
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# JSON-RPC server
jsonrpsee = { version = "0.26", features = ["server", "macros"] }

# MCP server
rmcp = { version = "0.12", features = ["server", "transport-io", "transport-streamable-http-server"] }

# POLYGLOT-5: the child seam. `--child NAME=stdio:CMD` is split as a shell
# would split it (shell-words), then run without one.
shell-words = "1.1"
# `ChildArgs` (feature `clap`): every service spells `--child` the same.
clap = { version = "4", features = ["derive", "env"], optional = true }
# A WebSocket child (feature `child-ws`): dialed with the service's key proof
# (spec/00) — signed here, so the seam needs neither the adapters nor a
# network client; `child-wss` adds TLS.
tokio-tungstenite = { version = "0.30", optional = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"], optional = true }
base64 = { version = "0.22", optional = true }

# Hub macro for activation generation. The pairing: macros and core move on
# the same minor line; only this direction can be a bound, since the macro
# emits paths into this crate without depending on it.
plexus-macros = { path = "../plexus-macros", version = "0.8.0" }

# MACRO-2.B3: the client-side wire contract the in-process transport speaks.
# Wasm-safe by construction; the dependency only runs this way, since
# plexus-client must build for wasm32 and plexus-core cannot.
# RETURNS-6: `schema` — the error frame carries plexus-client's `RemoteError`,
# and `PlexusStreamItem` derives `JsonSchema`.
plexus-client = { path = "../plexus-macros/plexus-client", version = "0.8.0", features = ["schema"] }

# Sealed-type auth primitives. plexus-core re-exports AuthContext /
# VerifiedUser / Principal from here for backward compatibility. New code
# should import directly from plexus-auth-core. Per AUTHZ-CORE-CRATE-1.
plexus-auth-core = { path = "../plexus-auth-core", version = "0.2.2" }

[features]
# POLYGLOT-5: a WebSocket child is on by default (three small crates);
# `default-features = false` keeps stdio children only.
default = ["child-ws"]
# POLYGLOT-5: `ChildArgs`, the child seam's flags, as clap arguments.
clap = ["dep:clap"]
# POLYGLOT-5: a child on a WebSocket (ws://), dialed with a key proof.
child-ws = ["dep:tokio-tungstenite", "dep:ed25519-dalek", "dep:base64"]
# ... and on wss:// (TLS, webpki roots).
child-wss = ["child-ws", "tokio-tungstenite/rustls-tls-webpki-roots"]

[[test]]
name = "remote_child"
required-features = ["child-ws"]

[[test]]
name = "remote_child_perf"
required-features = ["child-ws"]

[dev-dependencies]
# LOCAL-6: tests/hub_transport.rs runs one client over the WebSocket too.
plexus-client = { path = "../plexus-macros/plexus-client", version = "0.8.0", features = ["ws-native"] }
tempfile = "3"
# POLYGLOT-5: tests/remote_child.rs signs a WebSocket child's trust in.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-test = "0.4"
# BIDIR-13: tests/question_matrix.rs answers a question from two sockets.
jsonrpsee = { version = "0.26", features = ["server", "macros", "ws-client"] }
# PERF-15: tests/describe_golden.rs pins each self-description answer by the
# sha256 of its bytes (already in the lock, through jsonrpsee and ring's users).
sha2 = "0.10"

# POLYGLOT-6: tests/conformance.rs serves the reference echo (plexus-wire's
# reference/echo-rs, taken by path) on a WebSocket under `key` — through
# plexus-transport, as every service does — and runs the conformance kit
# against it. A dev-dependency only: plexus-transport depends on this crate.
# No version: cargo strips it on publish, or neither crate could go first.
plexus-transport = { path = "../plexus-transport", default-features = false }

# Enable the `test-support` feature for plexus-auth-core in test builds
# only, so the end-to-end credential-envelope tests in
# `src/plexus/credential_envelope.rs` can mint real `Credential<T>`
# values. Added by AUTHZ-CRED-CORE-1B as part of wiring CRED-CORE-2's
# deferred end-to-end ACs (#1, #2 full, #4 end-to-end, #5 end-to-end).
plexus-auth-core = { path = "../plexus-auth-core", version = "0.2.2", features = ["test-support", "adapters"] }

# PERF-6 (PLEXUS/PERF-6): the one build perf runs and releases use, PERF-1's
# `profiles` fork built to its recommendation. Release, with LTO across every
# crate and one codegen unit, and line tables kept for flamegraphs; `panic` is
# release's (menger's tests rely on unwinding). Dev, test and release are
# unchanged. `cargo build --profile perf`; plexus-bench measures with it.
[profile.perf]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
