[package]
name = "plexus-core"
version = "0.9.0"
edition = "2021"
description = "Core infrastructure for Plexus RPC: Activation trait, DynamicHub, schemas"
license = "AGPL-3.0-only"
repository = "https://github.com/hypermemetic-ai/plexus-core"
# DIST-2: the published crate is the library — not the design notes, editor
# settings or hooks that live beside it in the repository.
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]

[lib]
name = "plexus_core"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# PERF-7: an item's frame is split off a block as `Bytes`, written as it is.
# BIDIR-17: `Input<Bytes>` is an input like any other, so `Bytes` is
# (de)serializable and has a schema.
bytes = { version = "1.9", features = ["serde"] }
# PERF-7: wrap_stream's stream, the method's own inside it unboxed.
pin-project-lite = "0.2"

# Async runtime. PLEXUS-45: tokio is in the target tables below — `full`
# natively, as it always was; the parts that build for wasm32 there.
tokio-stream = "0.1"
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# Bitflags for ChildCapabilities
bitflags = "2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Schema generation
schemars = { version = "1.1", features = ["derive", "uuid1", "bytes1"] }

# RETURNS-10: schema content hashes — SHA-256 of a method's canonical schema
# JSON, truncated to 16 hex (`plexus::content_hash`). RustCrypto, pure Rust.
sha2 = "0.10"

# HTTP types for RawRequestContext
http = "1"

# Core types
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# JSON-RPC server: in the target tables below (PLEXUS-45). Natively
# `server` + `macros`, as always; on wasm32 `server-core` + `macros`, which
# hold everything this crate uses (RpcModule, Methods, the subscription
# sinks, Params, ErrorObject, Extensions, ConnectionId) without hyper/mio.

# POLYGLOT-5: the child seam. `--child NAME=stdio:CMD` is split as a shell
# would split it (shell-words), then run without one.
shell-words = "1.1"
# `ChildArgs` (feature `clap`): every service spells `--child` the same.
clap = { version = "4", features = ["derive", "env"], optional = true }
# A WebSocket child (feature `child-ws`): dialed with the service's key proof
# (spec/00) — signed here, so the seam needs neither the adapters nor a
# network client; `child-wss` adds TLS. tokio-tungstenite is native-only
# (the target table below): on wasm32 there are no children (PLEXUS-45).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"], optional = true }
# BIDIR-17: an `Input<Bytes>` item sent as JSON is base64.
base64 = "0.22"

# Hub macro for activation generation. The pairing: macros and core move on
# the same minor line; only this direction can be a bound, since the macro
# emits paths into this crate without depending on it.
plexus-macros = { path = "../plexus-macros", version = "0.9.0" }

# MACRO-2.B3: the client-side wire contract the in-process transport speaks.
# Wasm-safe by construction; the dependency only runs this way (plexus-client
# carries no server). Since PLEXUS-45 plexus-core builds for wasm32 too.
# RETURNS-6: `schema` — the error frame carries plexus-client's `RemoteError`,
# and `PlexusStreamItem` derives `JsonSchema`.
plexus-client = { path = "../plexus-macros/plexus-client", version = "0.9.0", features = ["schema"] }

# Sealed-type auth primitives. plexus-core re-exports AuthContext /
# VerifiedUser / Principal from here for backward compatibility. New code
# should import directly from plexus-auth-core. Per AUTHZ-CORE-CRATE-1.
plexus-auth-core = { path = "../plexus-auth-core", version = "0.3.1" }

# PLEXUS-45: natively, every dependency exactly as before PLEXUS-45.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }
# plexus::input reads PendingSubscriptionSink::subscription_id, new in 0.26.1.
jsonrpsee = { version = "0.26.1", features = ["server", "macros"] }
tokio-tungstenite = { version = "0.30", optional = true }

# PLEXUS-45: wasm32-unknown-unknown (a browser, or node). No processes, no
# sockets of its own, one thread, no tokio runtime: tokio for its sync
# primitives and macros only; the runtime seam (`crate::rt`) spawns on the
# JS event loop (wasm-bindgen-futures), sleeps on `setTimeout` (futures-timer
# over gloo-timers, a `Send` future) and reads the JS clock (web-time);
# randomness and chrono's `Utc::now` come from the JS runtime. getrandom
# 0.3's `wasm_js` also needs `--cfg getrandom_backend="wasm_js"` in the
# target's rustflags.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.0", default-features = false, features = ["sync", "macros", "rt", "time", "io-util"] }
jsonrpsee = { version = "0.26.1", default-features = false, features = ["server-core", "macros"] }
wasm-bindgen-futures = "0.4"
futures-timer = { version = "3", features = ["wasm-bindgen"] }
web-time = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
uuid = { version = "1.6", features = ["js"] }
chrono = { version = "0.4", features = ["wasmbind"] }

[features]
# POLYGLOT-5: a WebSocket child is on by default (three small crates);
# `default-features = false` keeps stdio children only.
default = ["child-ws"]
# POLYGLOT-5: `ChildArgs`, the child seam's flags, as clap arguments.
clap = ["dep:clap"]
# POLYGLOT-5: a child on a WebSocket (ws://), dialed with a key proof.
child-ws = ["dep:tokio-tungstenite", "dep:ed25519-dalek"]
# ... and on wss:// (TLS, webpki roots).
child-wss = ["child-ws", "tokio-tungstenite/rustls-tls-webpki-roots"]
# RETURNS-47: `call::test::in_call`, a test's way into a call context (a
# verifier that reads `current_reach()`, tested without a service). Never
# default: nothing but a test builds a caller by hand.
test-util = []

[[test]]
name = "remote_child"
required-features = ["child-ws"]

[[test]]
name = "remote_child_perf"
required-features = ["child-ws"]

# RETURNS-47: no harness — the binary is the service and, run again by the
# seam, the plugin on stdio, whose stdout carries the protocol alone.
[[test]]
name = "returns47_hop"
harness = false

[dev-dependencies]
# RETURNS-47: this crate's own tests use `call::test::in_call`.
plexus-core = { path = ".", features = ["test-util"] }

# PLEXUS-45: every other test dependency is the native suite's, as before.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# LOCAL-6: tests/hub_transport.rs runs one client over the WebSocket too.
plexus-client = { path = "../plexus-macros/plexus-client", version = "0.9.0", features = ["ws-native"] }
tempfile = "3"
# POLYGLOT-5: tests/remote_child.rs signs a WebSocket child's trust in.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-test = "0.4"
# BIDIR-13: tests/question_matrix.rs answers a question from two sockets.
jsonrpsee = { version = "0.26", features = ["server", "macros", "ws-client"] }
# PERF-15: tests/describe_golden.rs pins each self-description answer by the
# sha256 of its bytes (already in the lock, through jsonrpsee and ring's users).
sha2 = "0.10"

# POLYGLOT-6: tests/conformance.rs serves the reference echo (plexus-wire's
# reference/echo-rs, taken by path) on a WebSocket under `key` — through
# plexus-transport, as every service does — and runs the conformance kit
# against it. A dev-dependency only: plexus-transport depends on this crate.
# No version: cargo strips it on publish, or neither crate could go first.
plexus-transport = { path = "../plexus-transport", default-features = false }

# Enable the `test-support` feature for plexus-auth-core in test builds
# only, so the end-to-end credential-envelope tests in
# `src/plexus/credential_envelope.rs` can mint real `Credential<T>`
# values. Added by AUTHZ-CRED-CORE-1B as part of wiring CRED-CORE-2's
# deferred end-to-end ACs (#1, #2 full, #4 end-to-end, #5 end-to-end).
plexus-auth-core = { path = "../plexus-auth-core", version = "0.3.1", features = ["test-support", "adapters"] }

# PLEXUS-45: tests/wasm_dispatch.rs, a DynamicHub dispatched in wasm32 under
# Node (`scripts/wasm-test.sh`); its timers and clock are the normal
# wasm32 dependencies above.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# PERF-6 (PLEXUS/PERF-6): the one build perf runs and releases use, PERF-1's
# `profiles` fork built to its recommendation. Release, with LTO across every
# crate and one codegen unit, and line tables kept for flamegraphs; `panic` is
# release's (menger's tests rely on unwinding). Dev, test and release are
# unchanged. `cargo build --profile perf`; plexus-bench measures with it.
[profile.perf]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
