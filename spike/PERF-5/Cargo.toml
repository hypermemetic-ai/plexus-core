[package]
name = "perf5"
version = "0.0.0"
edition = "2021"
publish = false
description = "PERF-5: a Plexus call from syscall to socket — the harness. A spike; nothing here ships. PERF-6 (plexus-bench) adopts its scenarios."

# Its own workspace: the spike never joins plexus-core's build.
[workspace]

[dependencies]
plexus-core = { path = "../.." }
plexus-macros = { path = "../../../plexus-macros" }
plexus-client = { path = "../../../plexus-macros/plexus-client" }
plexus-transport = { path = "../../../plexus-transport", default-features = false }
plexus-auth-core = { path = "../../../plexus-auth-core" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
jsonrpsee = { version = "0.26", features = ["server", "ws-client"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
schemars = { version = "1.1", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
pprof = { version = "0.15", features = ["flamegraph", "frame-pointer"] }
libc = "0.2"
memchr = "2"
bytes = "1"
core_affinity = "0.8"
# codecs on our own frames
sonic-rs = "0.5"
simd-json = "0.15"
postcard = { version = "1", features = ["alloc"] }
ciborium = "0.2"
rmp-serde = "1"
# the raw WebSocket ceilings (no Plexus)
fastwebsockets = { version = "0.10", features = ["upgrade"] }
tokio-tungstenite = "0.26"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# the key proof against a throwaway menger (the kit's spec/00 §Key proof)
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
rand = "0.8"
# PERF-17 E6 (PERF-12): mimalloc under the counting allocator, a cargo feature
mimalloc = { version = "0.1", optional = true, default-features = false }

[features]
# PERF-17: each experiment a switch, so the combination is one build
mimalloc = ["dep:mimalloc"]


[[bench]]
name = "inproc"
harness = false

[[bench]]
name = "codec"
harness = false

[profile.release]
debug = "line-tables-only"

# PERF-1's `profiles` fork, on trial: the same build with LTO fat and one codegen unit.
# PERF-17 E6: run.sh adds `-C target-cpu=native` to this profile's RUSTFLAGS (NATIVE=0 leaves it out).
[profile.perf]
inherits = "release"
lto = "fat"
codegen-units = 1

# PERF-17 E2a (PERF-8): jsonrpsee-server 0.26.1 vendored into plexus-transport
# (`vendor/jsonrpsee-server`, as archive/LOCAL-3 did) with one flush per wakeup
# behind PERF17_WS_COALESCE=N (unset: 0.26.1's flush per message).
[patch.crates-io]
jsonrpsee-server = { path = "../../../plexus-transport/vendor/jsonrpsee-server" }
