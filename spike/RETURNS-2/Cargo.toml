# RETURNS-3 (spike, child of RETURNS-2): can a method's hash cover the shape
# of its types? A standalone probe — not a member of plexus-core, not built
# by it. `run.sh` builds it several ways and compares the outputs.
#
# Versions are pinned to menger's Cargo.lock (schemars 1.2.2, serde_json
# 1.0.151) so the probe sees the schemars output a real backend sees;
# plexus-core ignores Cargo.lock, so the pins live here.
[package]
name = "returns3-hash-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "returns3-hash-spike"
path = "src/main.rs"

[features]
# Build B: serde_json's Map becomes insertion-ordered (IndexMap) — the
# feature-unification flip any crate in a backend's graph can trigger — so
# the raw JSON's key order changes between builds while the code does not.
preserve_order = ["serde_json/preserve_order", "schemars/preserve_order"]

[dependencies]
schemars = { version = "=1.2.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
